<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多计时器 - 分组版</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-active: #22253a;
    --border: #2a2d3a;
    --accent: #5b8df9;
    --accent-glow: rgba(91,141,249,.25);
    --danger: #f55;
    --danger-glow: rgba(255,85,85,.3);
    --success: #4cdf8b;
    --warning: #ffa726;
    --text: #e8e8ed;
    --text2: #8b8fa3;
    --radius: 14px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 40px;
  }

  /* ---------- header ---------- */
  .header {
    max-width: 1400px;
    margin: 0 auto 28px;
    text-align: center;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }
  .header p { color: var(--text2); font-size: 14px; }

  /* ---------- controls bar ---------- */
  .controls {
    max-width: 1400px;
    margin: 0 auto 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
  }
  .controls label {
    font-size: 14px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .controls input[type=number] {
    width: 64px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 15px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .controls input::-webkit-outer-spin-button,
  .controls input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn-primary  { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4a7ce8; }
  .btn-danger   { background: var(--danger); color: #fff; }
  .btn-danger:hover  { background: #e04040; }
  .btn-success  { background: var(--success); color: #000; }
  .btn-success:hover { background: #3cc07a; }
  .btn-ghost    { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  .btn-ghost:hover   { border-color: var(--text2); color: var(--text); }
  .btn-sm { padding: 5px 12px; font-size: 13px; }

  /* ---------- group container ---------- */
  .groups-container {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ---------- group ---------- */
  .group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: .3s;
  }
  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .group-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .group-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 6px;
    transition: .2s;
  }
  .group-name:hover { background: rgba(255,255,255,.1); }
  .group-count {
    font-size: 13px;
    color: var(--text2);
    background: var(--bg);
    padding: 2px 10px;
    border-radius: 12px;
  }
  .group-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .group-remove {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: .2s;
  }
  .group-remove:hover { color: var(--danger); background: rgba(255,85,85,.1); }

  /* ---------- grid ---------- */
  .grid {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 16px;
  }

  /* ---------- timer card ---------- */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    transition: .3s;
    flex: 1 1 220px;
    max-width: 350px;
    min-width: 200px;
  }
  .card.warning {
    border-color: var(--warning);
    box-shadow: 0 0 15px rgba(255, 167, 38, .2);
  }
  .card.alerting {
    border-color: var(--danger);
    box-shadow: 0 0 20px var(--danger-glow);
  }
  .card.alerting.pulsing {
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 20px var(--danger-glow); }
    50%     { box-shadow: 0 0 40px var(--danger-glow); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.alerting.pulsing { animation: none; }
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .card-id {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 3px 10px;
    border-radius: 20px;
    cursor: pointer;
  }
  .card-id.warning { background: var(--warning); }
  .card-id.alerting { background: var(--danger); }
  .card-id:hover { opacity: .85; }
  .card-remove {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    transition: .2s;
  }
  .card-remove:hover { color: var(--danger); background: rgba(255,85,85,.1); }

  .time-display {
    font-size: 48px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 6px;
    line-height: 1.1;
  }

  .time-ms {
    font-size: 16px;
    font-weight: 400;
    color: var(--text2);
    text-align: center;
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }

  .warning-text {
    color: var(--warning);
    font-weight: 600;
  }

  .card-target {
    text-align: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text2);
  }

  .card-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .card-actions .btn { flex: 1; max-width: 110px; justify-content: center; }

  /* ---------- alert banner ---------- */
  .alert-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--danger);
    color: #fff;
    text-align: center;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    z-index: 1000;
    transform: translateY(-100%);
    transition: transform .35s ease;
    cursor: pointer;
  }
  .alert-banner.show { transform: translateY(0); }

  /* ---------- empty state ---------- */
  .empty {
    text-align: center;
    color: var(--text2);
    padding: 60px 20px;
    font-size: 15px;
  }
  .empty span { font-size: 40px; display: block; margin-bottom: 12px; }

  /* ---------- sound badge ---------- */
  .sound-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    z-index: 500;
    transition: .2s;
  }
  .sound-toggle:hover { border-color: var(--text2); }

  /* ---------- search input ---------- */
  .search-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .search-wrapper input {
    width: 160px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 14px;
    transition: border-color .2s;
  }
  .search-wrapper input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-wrapper input::placeholder {
    color: var(--text2);
  }

  /* ---------- responsive ---------- */
  @media (max-width: 768px) {
    .time-display { font-size: 40px; }
    .search-wrapper input { width: 140px; }
    .card { max-width: 100%; }
  }
  @media (max-width: 480px) {
    .time-display { font-size: 32px; }
    .controls { flex-direction: column; }
    body { padding: 16px 10px 32px; }
    .search-wrapper input { width: 100%; }
  }
</style>
</head>
<body>

<div class="alert-banner" id="alertBanner" role="alert" onclick="dismissBanner()"></div>

<div class="header">
  <h1>⏱ 多计时器</h1>
  <p>分组管理多个计时器，到达设定时间自动提醒</p>
</div>

<div class="controls">
  <label>
    目标时间
    <input type="number" id="targetMin" value="0" min="0" max="999" oninput="syncTarget()"> 分
    <input type="number" id="targetSec" value="60" min="0" max="59" oninput="syncTarget()"> 秒
  </label>
  <label>
    提前提醒
    <input type="number" id="warningMin" value="0" min="0" max="60" oninput="syncWarning()"> 分
    <input type="number" id="warningSec" value="30" min="0" max="59" oninput="syncWarning()"> 秒
  </label>
  <button class="btn btn-primary" onclick="addGroup()">+ 新建分组</button>
  <button class="btn btn-danger btn-sm" id="resetAllBtn" onclick="resetAll()">全部重置</button>
  <div class="search-wrapper">
    🔍
    <input type="text" id="searchInput" placeholder="搜索计时器..." oninput="filterTimers()">
  </div>
</div>

<div class="groups-container" id="groupsContainer"></div>

<div class="empty" id="empty">
  <span>🕐</span>
  点击「新建分组」开始
</div>

<button class="sound-toggle" id="soundBtn" onclick="toggleSound()" title="开关提示音" aria-label="开关提示音" aria-pressed="true">🔔</button>

<script>
// ─── state ───
let nextGroupId = 1;
let nextTimerId = 1;
let groups = [];  // { id, name, timers: [{ id, name, elapsed, running, deadline, alerted, reachedAt }] }
let targetSeconds = 60;
let warningSeconds = 30;
let soundOn = true;
let saveTimer = null;

// ─── persistence ───
const STORAGE_KEY = 'multi-timer-groups-state';

function save() {
  const data = {
    nextGroupId,
    nextTimerId,
    targetSeconds,
    warningSeconds,
    soundOn,
    groups: groups.map(g => ({
      id: g.id,
      name: g.name,
      timers: g.timers.map(t => ({
        id: t.id,
        name: t.name,
        elapsed: t.elapsed,
        running: t.running,
        deadline: t.deadline || null,
        alerted: t.alerted,
        reachedAt: t.reachedAt || null
      }))
    }))
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    nextGroupId = data.nextGroupId || 1;
    nextTimerId = data.nextTimerId || 1;
    targetSeconds = data.targetSeconds || 60;
    warningSeconds = data.warningSeconds || 30;
    soundOn = data.soundOn !== false;
    groups = (data.groups || []).map(g => ({
      id: g.id,
      name: g.name,
      timers: (g.timers || []).map(t => ({
        id: t.id,
        name: (t.name && !t.name.match(/^#\d+$/)) ? t.name : '',
        elapsed: t.elapsed || 0,
        running: t.running || false,
        deadline: t.deadline || null,
        alerted: t.alerted || false,
        reachedAt: t.reachedAt || null
      }))
    }));
    // Recompute elapsed for running timers
    const now = Date.now();
    groups.forEach(g => {
      g.timers.forEach(t => {
        if (t.running && t.deadline) {
          t.elapsed = targetSeconds - (t.deadline - now) / 1000;
        }
        if (t.running && !t.alerted && t.elapsed >= targetSeconds) {
          t.alerted = true;
          t.reachedAt = t.deadline || now;
        }
      });
    });
    // Rebuild alert state
    alertedIds.clear();
    groups.forEach(g => g.timers.forEach(t => { if (t.alerted) alertedIds.add(t.id); }));
    if (alertedIds.size > 0) updateAlertBanner();
    // Update UI
    document.getElementById('targetMin').value = Math.floor(targetSeconds / 60);
    document.getElementById('targetSec').value = targetSeconds % 60;
    document.getElementById('warningMin').value = Math.floor(warningSeconds / 60);
    document.getElementById('warningSec').value = warningSeconds % 60;
    document.getElementById('soundBtn').textContent = soundOn ? '🔔' : '🔕';
    document.getElementById('soundBtn').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  } catch(e) {}
}

function startSaveLoop() {
  if (saveTimer) return;
  saveTimer = setInterval(save, 1000);
}

function stopSaveLoop() {
  const allTimers = groups.flatMap(g => g.timers);
  if (allTimers.every(t => !t.running)) {
    clearInterval(saveTimer);
    saveTimer = null;
    save();
  }
}

// ─── speech ───
let speechQueue = 0;

function speak(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  if (!text) return;
  if (speechQueue >= 3) return;
  speechQueue++;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 1;
  u.onend = () => { speechQueue = Math.max(0, speechQueue - 1); };
  u.onerror = () => { speechQueue = Math.max(0, speechQueue - 1); };
  speechSynthesis.speak(u);
}

// ─── audio context ───
let audioCtx;

function ensureAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try {
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e) {}
}

async function beep(freq, duration) {
  if (!soundOn) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') {
      try { await audioCtx.resume(); } catch(e) { return; }
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
    osc.start();
    osc.stop(audioCtx.currentTime + duration / 1000);
  } catch(e) {}
}

function alertSound() {
  beep(880, 150);
  setTimeout(() => beep(1100, 150), 180);
  setTimeout(() => beep(880, 250), 380);
}

// ─── helpers ───
function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) {
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function fmtMs(sec) {
  return '.' + String(Math.floor((sec % 1) * 100)).padStart(2,'0');
}

function getTarget() {
  const m = parseInt(document.getElementById('targetMin').value) || 0;
  const s = parseInt(document.getElementById('targetSec').value) || 0;
  const total = m * 60 + s;
  return Math.max(1, total);
}

function updateTargetDisplay() {
  const t = getTarget();
  document.getElementById('targetMin').value = Math.floor(t / 60);
  document.getElementById('targetSec').value = t % 60;
}

function syncTarget() {
  targetSeconds = getTarget();
  updateTargetDisplay();
  groups.forEach(g => {
    g.timers.forEach(t => {
      if (t.running && t.deadline) {
        t.deadline = Date.now() + Math.max(0, targetSeconds - t.elapsed) * 1000;
      }
      checkReached(t);
    });
  });
  renderAll();
  save();
}

function syncWarning() {
  const m = parseInt(document.getElementById('warningMin').value) || 0;
  const s = parseInt(document.getElementById('warningSec').value) || 0;
  warningSeconds = Math.max(0, m * 60 + s);
  renderAll();
  save();
}

// ─── notification permission ───
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

// ─── find timer helper ───
function findTimer(timerId) {
  for (const g of groups) {
    const t = g.timers.find(t => t.id === timerId);
    if (t) return { group: g, timer: t };
  }
  return null;
}

// ─── get timer display index ───
function getTimerDisplayIndex(timerId) {
  for (const group of groups) {
    const index = group.timers.findIndex(t => t.id === timerId);
    if (index !== -1) return index + 1;
  }
  return 1;
}

// ─── get timer display name ───
function getTimerDisplayName(timer) {
  if (timer.name) return timer.name;
  return String(getTimerDisplayIndex(timer.id));
}

// ─── group CRUD ───
function addGroup() {
  const newId = nextGroupId++;
  groups.push({ id: newId, name: `分组 ${newId}`, timers: [] });
  save();
  renderAll();
}

function removeGroup(groupId) {
  const group = groups.find(g => g.id === groupId);
  if (!group) return;
  // Remove alert state for all timers in this group
  group.timers.forEach(t => alertedIds.delete(t.id));
  if (alertedIds.size === 0) dismissBanner(); else updateAlertBanner();
  groups = groups.filter(g => g.id !== groupId);
  save();
  stopTickIfIdle();
  stopSaveLoop();
  renderAll();
}

function startRenameGroup(groupId) {
  const group = groups.find(g => g.id === groupId);
  if (!group) return;
  const el = document.querySelector(`[data-group-name="${groupId}"]`);
  if (!el || el.querySelector('input')) return;

  const input = document.createElement('input');
  input.type = 'text';
  input.value = group.name;
  input.maxLength = 30;
  input.style.cssText = `
    background: var(--accent); color: #fff; border: none; outline: none;
    font-size: 18px; font-weight: 700; padding: 2px 8px; border-radius: 6px;
    width: ${Math.max(100, el.offsetWidth)}px; text-align: left;
    font-family: inherit;
  `;

  const commit = () => {
    const newName = input.value.trim();
    if (newName) group.name = newName;
    save();
    el.textContent = group.name;
  };

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = group.name; input.blur(); }
  });

  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();
}

// ─── timer CRUD ───
function addTimer(groupId) {
  requestNotificationPermission();
  ensureAudio();
  targetSeconds = getTarget();
  updateTargetDisplay();
  const group = groups.find(g => g.id === groupId);
  if (!group) return;
  const newId = nextTimerId++;
  group.timers.push({
    id: newId, name: '', elapsed: 0, running: false,
    deadline: null, alerted: false, reachedAt: null
  });
  save();
  renderAll();
}

function removeTimer(timerId) {
  const found = findTimer(timerId);
  if (!found) return;
  found.group.timers = found.group.timers.filter(t => t.id !== timerId);
  alertedIds.delete(timerId);
  if (alertedIds.size === 0) dismissBanner(); else updateAlertBanner();
  save();
  stopTickIfIdle();
  stopSaveLoop();
  renderAll();
}

function checkReached(t) {
  if (!t.alerted && t.elapsed >= targetSeconds) {
    t.alerted = true;
    t.reachedAt = Date.now();
    triggerAlert(t.id);
    return true;
  }
  return false;
}

// ─── tick ───
let tickInterval = null;

function ensureTick() {
  if (tickInterval) return;
  tickInterval = setInterval(tick, 50);
}

function stopTickIfIdle() {
  const allTimers = groups.flatMap(g => g.timers);
  if (tickInterval && allTimers.every(t => !t.running)) {
    clearInterval(tickInterval);
    tickInterval = null;
  }
}

function tick() {
  const now = Date.now();
  groups.forEach(g => {
    g.timers.forEach(t => {
      if (!t.running) return;
      t.elapsed = targetSeconds - (t.deadline - now) / 1000;
      checkReached(t);
      updateCard(t);
    });
  });
}

function startTimer(timerId) {
  const found = findTimer(timerId);
  if (!found) return;
  const t = found.timer;
  if (t.running) return;
  targetSeconds = getTarget();
  t.running = true;
  if (!t.deadline) {
    t.deadline = Date.now() + Math.max(0, targetSeconds - t.elapsed) * 1000;
  }
  updateCard(t);
  ensureTick();
  startSaveLoop();
}

function pauseTimer(timerId) {
  const found = findTimer(timerId);
  if (!found) return;
  const t = found.timer;
  if (!t.running) return;
  t.running = false;
  if (t.deadline) {
    t.elapsed = targetSeconds - (t.deadline - Date.now()) / 1000;
    t.deadline = null;
  }
  checkReached(t);
  updateCard(t);
  save();
  stopTickIfIdle();
  stopSaveLoop();
}

function resetTimer(timerId) {
  const found = findTimer(timerId);
  if (!found) return;
  const t = found.timer;
  t.elapsed = 0;
  t.running = false;
  t.deadline = null;
  t.alerted = false;
  t.reachedAt = null;
  alertedIds.delete(timerId);
  if (alertedIds.size === 0) dismissBanner(); else updateAlertBanner();
  updateCard(t);
  save();
  stopTickIfIdle();
  stopSaveLoop();
}

// ─── reset all ───
let resetConfirmTimer = null;

function resetAll() {
  const btn = document.getElementById('resetAllBtn');
  if (!btn.dataset.confirm) {
    btn.dataset.confirm = '1';
    btn.textContent = '确认重置？';
    btn.classList.remove('btn-danger');
    btn.classList.add('btn-ghost');
    resetConfirmTimer = setTimeout(() => cancelResetConfirm(), 3000);
    return;
  }
  cancelResetConfirm();
  alertedIds.clear();
  groups.forEach(g => {
    g.timers.forEach(t => {
      t.elapsed = 0;
      t.running = false;
      t.deadline = null;
      t.alerted = false;
      t.reachedAt = null;
    });
  });
  dismissBanner();
  save();
  stopTickIfIdle();
  stopSaveLoop();
  renderAll();
}

function cancelResetConfirm() {
  clearTimeout(resetConfirmTimer);
  resetConfirmTimer = null;
  const btn = document.getElementById('resetAllBtn');
  delete btn.dataset.confirm;
  btn.textContent = '全部重置';
  btn.classList.remove('btn-ghost');
  btn.classList.add('btn-danger');
}

// ─── reset group ───
let resetGroupTimers = {};

function resetGroup(groupId) {
  const btn = document.querySelector(`[data-reset-group="${groupId}"]`);
  if (!btn) return;

  if (!btn.dataset.confirm) {
    btn.dataset.confirm = '1';
    btn.textContent = '确认重置？';
    btn.classList.remove('btn-danger');
    btn.classList.add('btn-ghost');
    resetGroupTimers[groupId] = setTimeout(() => cancelResetGroupConfirm(groupId), 3000);
    return;
  }

  cancelResetGroupConfirm(groupId);
  const group = groups.find(g => g.id === groupId);
  if (!group) return;

  group.timers.forEach(t => {
    t.elapsed = 0;
    t.running = false;
    t.deadline = null;
    t.alerted = false;
    t.reachedAt = null;
    alertedIds.delete(t.id);
  });

  if (alertedIds.size === 0) dismissBanner(); else updateAlertBanner();
  save();
  stopTickIfIdle();
  stopSaveLoop();
  renderAll();
}

function cancelResetGroupConfirm(groupId) {
  clearTimeout(resetGroupTimers[groupId]);
  delete resetGroupTimers[groupId];
  const btn = document.querySelector(`[data-reset-group="${groupId}"]`);
  if (!btn) return;
  delete btn.dataset.confirm;
  btn.textContent = '重置该组';
  btn.classList.remove('btn-ghost');
  btn.classList.add('btn-danger');
}

// ─── alerting ───
let alertBeepLoop = null;
const alertedIds = new Set();

function buildAlertSpeech() {
  const items = [...alertedIds]
    .map(id => findTimer(id))
    .filter(Boolean);
  if (items.length === 0) return '';
  if (items.length === 1) {
    const f = items[0];
    return `${f.group.name}组${getTimerDisplayName(f.timer)}号时间到`;
  }
  return items.map(f => `${f.group.name}组${getTimerDisplayName(f.timer)}号`).join('、') + '全部时间到';
}

function updateAlertBanner() {
  const banner = document.getElementById('alertBanner');
  if (!banner) return;
  if (alertedIds.size === 0) {
    banner.classList.remove('show');
    return;
  }
  const m = Math.floor(targetSeconds / 60);
  const s = targetSeconds % 60;
  const allNames = [...alertedIds].map(id => {
    const f = findTimer(id);
    return f ? getTimerDisplayName(f.timer) : `#${id}`;
  });
  banner.textContent = `🔔 ${allNames.join('、')} 到达 ${m > 0 ? m + '分' : ''}${s}秒！点击关闭`;
  banner.classList.add('show');
}

function triggerAlert(id) {
  const found = findTimer(id);
  const label = found ? getTimerDisplayName(found.timer) : `#${id}`;
  alertedIds.add(id);
  if (!alertBeepLoop) {
    alertSound();
    speak(buildAlertSpeech());
    alertBeepLoop = setInterval(() => {
      alertSound();
      speak(buildAlertSpeech());
    }, 3000);
  } else {
    speak(buildAlertSpeech());
  }
  updateAlertBanner();
  if (found) updateCard(found.timer);
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(`⏰ 「${label}」到时`, { body: `已达到 ${fmt(targetSeconds)}` });
    } catch(e) {}
  }
  save();
}

function dismissBanner() {
  document.getElementById('alertBanner').classList.remove('show');
  alertedIds.clear();
  if (alertBeepLoop) {
    clearInterval(alertBeepLoop);
    alertBeepLoop = null;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speechQueue = 0;
  groups.forEach(g => g.timers.forEach(t => updateCard(t)));
}

// ─── render ───
function renderAll() {
  const container = document.getElementById('groupsContainer');
  const emptyEl = document.getElementById('empty');

  // Remove groups that no longer exist
  container.querySelectorAll('.group').forEach(el => {
    const gid = parseInt(el.dataset.groupId);
    if (!groups.some(g => g.id === gid)) el.remove();
  });

  // Build/update groups
  groups.forEach(g => {
    let groupEl = container.querySelector(`[data-group-id="${g.id}"]`);
    if (!groupEl) {
      groupEl = buildGroup(g);
      container.appendChild(groupEl);
    }
    // Update group name
    const nameEl = groupEl.querySelector(`[data-group-name="${g.id}"]`);
    if (nameEl && !nameEl.querySelector('input')) nameEl.textContent = g.name;
    // Update count
    const countEl = groupEl.querySelector(`[data-group-count="${g.id}"]`);
    if (countEl) {
      const activeCount = g.timers.filter(t => !t.alerted).length;
      const doneCount = g.timers.filter(t => t.alerted).length;
      countEl.textContent = `${g.timers.length} 个计时器` + (doneCount > 0 ? ` (${doneCount} 已到时)` : '');
    }
    // Remove cards for timers that no longer exist
    groupEl.querySelectorAll('.card').forEach(card => {
      const tid = parseInt(card.id.replace('card-', ''));
      if (!g.timers.some(t => t.id === tid)) card.remove();
    });
    // Sort and render cards
    renderGroupTimers(g, groupEl);
  });

  // Update empty state
  const allTimers = groups.flatMap(g => g.timers);
  emptyEl.style.display = groups.length === 0 ? 'block' : 'none';

  // Apply search filter
  filterTimers();
}

function renderGroupTimers(group, groupEl) {
  const grid = groupEl.querySelector('.grid');
  if (!grid) return;

  // Sort: warning first, then active, then done
  const sorted = [...group.timers].sort((a, b) => {
    const aRemaining = targetSeconds - a.elapsed;
    const bRemaining = targetSeconds - b.elapsed;
    const aIsWarning = !a.alerted && aRemaining <= warningSeconds;
    const bIsWarning = !b.alerted && bRemaining <= warningSeconds;
    const aIsDone = a.alerted;
    const bIsDone = b.alerted;

    // Order: warning (1) > active (2) > done (3)
    const aOrder = aIsWarning ? 1 : aIsDone ? 3 : 2;
    const bOrder = bIsWarning ? 1 : bIsDone ? 3 : 2;

    if (aOrder !== bOrder) return aOrder - bOrder;

    // Within same category, sort by remaining time (ascending)
    if (!aIsDone && !bIsDone) return aRemaining - bRemaining;

    // Done: sort by reachedAt (ascending)
    return (a.reachedAt || 0) - (b.reachedAt || 0);
  });

  // Reorder DOM and update display names
  sorted.forEach((t, index) => {
    const card = getOrBuildCard(t);
    grid.appendChild(card);
    // Update badge display name for timers without custom names
    if (!t.name) {
      const badge = card.querySelector('[data-part="badge"]');
      if (badge && !badge.querySelector('input')) {
        badge.textContent = String(index + 1);
      }
    }
  });
}

function buildGroup(g) {
  const div = document.createElement('div');
  div.className = 'group';
  div.dataset.groupId = g.id;

  div.innerHTML = `
    <div class="group-header">
      <div class="group-title">
        <span class="group-name" data-group-name="${g.id}" onclick="startRenameGroup(${g.id})" title="点击编辑名称"></span>
        <span class="group-count" data-group-count="${g.id}"></span>
      </div>
      <div class="group-actions">
        <button class="btn btn-success btn-sm" onclick="addTimer(${g.id})">+ 添加计时器</button>
        <button class="btn btn-danger btn-sm" data-reset-group="${g.id}" onclick="resetGroup(${g.id})">重置该组</button>
        <button class="group-remove" onclick="removeGroup(${g.id})" title="删除分组">×</button>
      </div>
    </div>
    <div class="grid"></div>
  `;

  div.querySelector(`[data-group-name="${g.id}"]`).textContent = g.name;
  return div;
}

function getOrBuildCard(t) {
  return document.getElementById('card-' + t.id) || buildCard(t);
}

function buildCard(t) {
  const remaining = Math.max(0, targetSeconds - t.elapsed);
  const isWarning = !t.alerted && remaining <= warningSeconds;
  const reached = t.elapsed >= targetSeconds;

  const div = document.createElement('div');
  div.className = 'card' + (t.alerted ? ' alerting' : '') + (t.alerted && alertedIds.has(t.id) ? ' pulsing' : '') + (isWarning ? ' warning' : '');
  div.id = 'card-' + t.id;

  div.innerHTML = `
    <div class="card-top">
      <span class="card-id ${t.alerted ? 'alerting' : ''} ${isWarning ? 'warning' : ''}" data-part="badge" onclick="startRename(${t.id})" title="点击编辑名称"></span>
      <button class="card-remove" onclick="removeTimer(${t.id})" title="删除">×</button>
    </div>
    <div class="time-display" data-part="time">${fmt(t.elapsed)}</div>
    <div class="time-ms" data-part="ms">${fmtMs(t.elapsed)}</div>
    <div class="card-target" data-part="target">
      ${reached ? '✅ 已到达目标' : isWarning ? '⚠️ 即将到时 ' + fmt(remaining) : '距目标 ' + fmt(remaining)}
    </div>
    <div class="card-actions" data-part="actions">
      ${t.running
        ? `<button class="btn btn-ghost btn-sm" data-action="pause" onclick="pauseTimer(${t.id})">⏸ 暂停</button>`
        : `<button class="btn btn-primary btn-sm" data-action="start" onclick="startTimer(${t.id})">▶ 开始</button>`
      }
      <button class="btn btn-ghost btn-sm" onclick="resetTimer(${t.id})">↺ 重置</button>
    </div>`;

  div.querySelector('[data-part="badge"]').textContent = getTimerDisplayName(t);
  return div;
}

function updateCard(t) {
  const card = document.getElementById('card-' + t.id);
  if (!card) return;

  const reached = t.elapsed >= targetSeconds;
  const remaining = Math.max(0, targetSeconds - t.elapsed);
  const isWarning = !t.alerted && remaining <= warningSeconds;

  card.classList.toggle('alerting', t.alerted);
  card.classList.toggle('pulsing', t.alerted && alertedIds.has(t.id));
  card.classList.toggle('warning', isWarning);

  const timeEl = card.querySelector('[data-part="time"]');
  const timeText = fmt(t.elapsed);
  if (timeEl && timeEl.textContent !== timeText) timeEl.textContent = timeText;

  const msEl = card.querySelector('[data-part="ms"]');
  const msText = fmtMs(t.elapsed);
  if (msEl && msEl.textContent !== msText) msEl.textContent = msText;

  const targetEl = card.querySelector('[data-part="target"]');
  if (targetEl) {
    const targetText = reached ? '✅ 已到达目标' : isWarning ? '⚠️ 即将到时 ' + fmt(remaining) : '距目标 ' + fmt(remaining);
    targetEl.style.color = reached ? 'var(--danger)' : isWarning ? 'var(--warning)' : 'var(--text2)';
    targetEl.classList.toggle('warning-text', isWarning);
    if (targetEl.textContent !== targetText) targetEl.textContent = targetText;
  }

  const badge = card.querySelector('[data-part="badge"]');
  if (badge) {
    badge.classList.toggle('alerting', t.alerted);
    badge.classList.toggle('warning', isWarning);
    if (!badge.querySelector('input')) badge.textContent = getTimerDisplayName(t);
  }

  const actionsEl = card.querySelector('[data-part="actions"]');
  if (actionsEl) {
    const startBtn = actionsEl.querySelector('[data-action="start"]');
    const pauseBtn = actionsEl.querySelector('[data-action="pause"]');

    if (t.running && startBtn) {
      const newBtn = document.createElement('button');
      newBtn.className = 'btn btn-ghost btn-sm';
      newBtn.setAttribute('data-action', 'pause');
      newBtn.setAttribute('onclick', `pauseTimer(${t.id})`);
      newBtn.textContent = '⏸ 暂停';
      startBtn.replaceWith(newBtn);
    } else if (!t.running && pauseBtn) {
      const newBtn = document.createElement('button');
      newBtn.className = 'btn btn-primary btn-sm';
      newBtn.setAttribute('data-action', 'start');
      newBtn.setAttribute('onclick', `startTimer(${t.id})`);
      newBtn.textContent = '▶ 开始';
      pauseBtn.replaceWith(newBtn);
    }
  }
}

// ─── sound toggle ───
function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔔' : '🔕';
  document.getElementById('soundBtn').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  if (soundOn) ensureAudio();
  save();
}

// ─── rename timer ───
function startRename(id) {
  const found = findTimer(id);
  if (!found) return;
  const t = found.timer;
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const badge = card.querySelector('[data-part="badge"]');
  if (!badge || badge.querySelector('input')) return;

  const remaining = Math.max(0, targetSeconds - t.elapsed);
  const isWarning = !t.alerted && remaining <= warningSeconds;

  const input = document.createElement('input');
  input.type = 'text';
  input.value = t.name;
  input.maxLength = 20;
  input.placeholder = getTimerDisplayName(t);
  input.style.cssText = `
    background: var(--accent); color: #fff; border: none; outline: none;
    font-size: 13px; font-weight: 700; padding: 2px 6px; border-radius: 20px;
    width: ${Math.max(60, badge.offsetWidth)}px; text-align: center;
    font-family: inherit;
  `;
  if (t.alerted) input.style.background = 'var(--danger)';
  else if (isWarning) input.style.background = 'var(--warning)';

  const commit = () => {
    const newName = input.value.trim();
    t.name = newName;
    save();
    badge.textContent = getTimerDisplayName(t);
    badge.onclick = () => startRename(id);
  };

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = t.name; input.blur(); }
  });

  badge.textContent = '';
  badge.onclick = null;
  badge.appendChild(input);
  input.focus();
  input.select();
}

// ─── search/filter ───
function filterTimers() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const allCards = document.querySelectorAll('.card');
  let visibleCount = 0;

  allCards.forEach(card => {
    const badge = card.querySelector('[data-part="badge"]');
    if (!badge) return;
    const name = badge.textContent.toLowerCase();
    const matches = !query || name.includes(query);
    card.style.display = matches ? '' : 'none';
    if (matches) visibleCount++;
  });

  // Hide groups with no visible cards
  document.querySelectorAll('.group').forEach(groupEl => {
    const visibleCards = groupEl.querySelectorAll('.card[style=""], .card:not([style])');
    const hasVisible = Array.from(groupEl.querySelectorAll('.card')).some(c => c.style.display !== 'none');
    groupEl.style.display = hasVisible || !query ? '' : 'none';
  });

  const emptyEl = document.getElementById('empty');
  if (emptyEl) {
    if (query && visibleCount === 0) {
      emptyEl.style.display = 'block';
      emptyEl.innerHTML = '<span>🔍</span>未找到匹配的计时器';
    } else if (groups.length === 0) {
      emptyEl.style.display = 'block';
      emptyEl.innerHTML = '<span>🕐</span>点击「新建分组」开始';
    } else {
      emptyEl.style.display = 'none';
    }
  }
}

// ─── init ───
load();
renderAll();
// Resume running timers
groups.forEach(g => {
  g.timers.forEach(t => {
    if (t.running) {
      t.running = false;
      startTimer(t.id);
    }
  });
});
</script>
